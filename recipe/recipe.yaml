context:
  version: "2.72.1"

package:
  name: chezmoi
  version: ${{ version }}

source:
  url: https://github.com/twpayne/chezmoi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 52a2fbff0c11285bac91b9267bce0f48069153c111890debf61836953dfcbca8

build:
  number: 1
  skip: win
  dynamic_linking:
    overlinking_behavior: error
    overdepending_behavior: error
  script:
    - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${{ version }}" -o chezmoi .
    - mkdir -p "$PREFIX/bin" "$PREFIX/share/bash-completion/completions" "$PREFIX/share/zsh/site-functions" "$PREFIX/share/fish/vendor_completions.d"
    - install -m755 chezmoi "$PREFIX/bin/chezmoi"
    - install -m644 completions/chezmoi-completion.bash "$PREFIX/share/bash-completion/completions/chezmoi"
    - install -m644 completions/chezmoi.zsh "$PREFIX/share/zsh/site-functions/_chezmoi"
    - install -m644 completions/chezmoi.fish "$PREFIX/share/fish/vendor_completions.d/chezmoi.fish"

requirements:
  build:
    - go >=1.26
  run: []

tests:
  - script:
      - chezmoi --version
  - package_contents:
      files:
        - share/bash-completion/completions/chezmoi
        - share/zsh/site-functions/_chezmoi
        - share/fish/vendor_completions.d/chezmoi.fish

about:
  homepage: https://chezmoi.io
  summary: Manage your dotfiles across multiple diverse machines, securely.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/twpayne/chezmoi

extra:
  recipe-maintainers:
    - black-desk
